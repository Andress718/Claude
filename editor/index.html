<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Editor de Video</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Bebas+Neue&family=Lobster&family=Montserrat:wght@400;700&family=Oswald:wght@400;700&family=Pacifico&family=Permanent+Marker&family=Playfair+Display:ital,wght@0,400;0,700;1,400;1,700&family=Poppins:wght@400;700&family=Roboto+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header id="topbar">
  <div class="brand">🎬 <b>Editor de Video</b></div>
  <label class="field-inline">Formato
    <select id="aspect"></select>
  </label>
  <label class="field-inline">Calidad
    <select id="quality"><option value="480">480p</option><option value="720" selected>720p</option><option value="1080">1080p</option></select>
  </label>
  <label class="field-inline">Fondo <input type="color" id="bg" value="#000000"></label>
  <div class="spacer"></div>
  <button id="btn-undo" title="Deshacer (Ctrl+Z)">↶</button>
  <button id="btn-redo" title="Rehacer (Ctrl+Shift+Z)">↷</button>
  <button id="btn-export" class="primary">⬇ Exportar MP4</button>
  <input type="file" id="file-media" accept="video/*,image/*,audio/*" multiple hidden>
  <input type="file" id="file-srt" accept=".srt,.vtt,text/plain" hidden>
  <input type="file" id="file-font" accept=".ttf,.otf,.woff,.woff2" hidden>
</header>

<main id="workspace">
  <aside id="library" class="panel">
    <nav id="lib-tabs"></nav>
    <div id="lib-body"></div>
  </aside>

  <section id="stage">
    <div id="canvas-wrap"><canvas id="screen" width="1280" height="720"></canvas></div>
    <div id="transport">
      <button id="btn-start" title="Inicio">⏮</button>
      <button id="btn-play" class="primary" title="Reproducir (Espacio)">▶</button>
      <span id="timecode">00:00.00 / 00:00.00</span>
      <div class="spacer"></div>
      <span class="hint">Arrastra sobre la vista previa para mover · rueda del ratón = escala</span>
      <button id="btn-split" title="Dividir en el cursor (S)">✂ Dividir</button>
    </div>
  </section>

  <aside id="inspector" class="panel"></aside>
</main>

<section id="timeline">
  <div id="tl-tools">
    <span>Zoom</span><input type="range" id="zoom" min="10" max="300" value="80">
    <button id="btn-add-vtrack">＋ Capa de video</button>
    <button id="btn-add-atrack">＋ Pista de audio</button>
    <span class="hint">Espacio: reproducir · S: dividir · Supr: eliminar · Ctrl+D: duplicar · ←/→: ±0.1s</span>
  </div>
  <div id="tl-body">
    <div id="tl-labels"></div>
    <div id="tl-scroll">
      <div id="tl-inner">
        <div id="ruler"></div>
        <div id="rows"></div>
        <div id="playhead"></div>
      </div>
    </div>
  </div>
</section>

<div id="overlay" hidden>
  <div class="modal">
    <h3 id="ov-title">Exportando MP4…</h3>
    <p>Se graba en tiempo real. Mantén esta pestaña visible hasta terminar.</p>
    <progress id="ov-progress" value="0" max="1"></progress>
    <button id="ov-cancel" class="danger">Cancelar</button>
  </div>
</div>

<script src="js/core.js"></script>
<script src="js/render.js"></script>
<script src="js/audio.js"></script>
<script src="js/ui.js"></script>
<script src="js/main.js"></script>
</body>
</html>
